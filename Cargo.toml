[package]
name = "maw"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Declarative system manager for Void Linux"
repository = "https://github.com/AamindMandragora/maw"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["tools/scrape-registry"]
